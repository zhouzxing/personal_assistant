<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manus Agent — 个人助手壁纸/开机界面</title>
<style>
:root{--bg:#05060a;--surface:rgba(18,22,36,.62);--surface2:rgba(28,34,50,.72);--border:rgba(99,102,241,.35);--text:#e8eaed;--dim:#9ca3af;--muted:#6b7280;--accent:#6366f1;--accent2:#a855f7;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--glass:rgba(255,255,255,.04);--r:16px;}
* { box-sizing:border-box; margin:0; padding:0; }
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
body{background:
  radial-gradient(circle at 50% 35%, rgba(99,102,241,.14) 0%, transparent 45%),
  radial-gradient(circle at 85% 15%, rgba(168,85,247,.12) 0%, transparent 40%),
  linear-gradient(135deg,#06070f 0%,#0a0c14 60%,#070810 100%);
}
body.app-mode{background:#0b0c12;}
/* 粒子背景 */
#canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}
/* 顶部系统栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:20px;}
.sys-time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);}
.sys-date{color:var(--dim);font-size:.85rem;line-height:1;}
.sys-stats{display:flex;gap:26px;color:var(--dim);font-size:.82rem;}
.sys-stats b{color:var(--text);}
body.wall-mode .sys-time,body.wall-mode .sys-date{color:var(--dim);}
/* 主舞台 */
.stage{position:relative;z-index:5;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;padding:0 24px;}
/* 角色卡 */
.char-card{position:relative;display:flex;flex-direction:column;align-items:center;width:min(700px,92vw);height:min(640px,88vh);background:var(--surface2);border:1px solid var(--border);border-radius:28px;box-shadow:0 30px 100px rgba(0,0,0,.55);backdrop-filter:blur(18px);overflow:hidden;animation:cardIn .9s cubic-bezier(.16,1,.3,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96);}to{opacity:1;transform:none;}}
.avatar-wrap{position:relative;flex:0 0 auto;width:260px;height:372px;margin-top:12px;border-radius:24px;border:4px solid var(--border);background:radial-gradient(ellipse at 50% 86%,rgba(99,102,241,.20),transparent 62%),radial-gradient(circle at 28% 22%,rgba(255,255,255,.10),transparent 58%),var(--bg);box-shadow:inset 0 -30px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.35);overflow:hidden;}
#avatar{width:100%;height:100%;object-fit:cover;transition:transform .5s ease,filter .4s ease;filter:drop-shadow(0 6px 24px rgba(0,0,0,.55));}
.avatar-wrap.talking #avatar{transform:scale(1.06);filter:drop-shadow(0 12px 32px rgba(99,102,241,.45));}
.avatar-wrap.thinking #avatar{filter:blur(1px) drop-shadow(0 8px 20px rgba(168,85,247,.35));}
.face{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.eyes{position:relative;width:104px;height:40px;overflow:hidden;}
.eye{position:absolute;width:32px;height:32px;border-radius:50%;background:var(--text);box-shadow:0 0 14px var(--text);top:4px;}
.eye.l{left:14px;}.eye.r{right:14px;}
.pupil{position:absolute;width:14px;height:14px;background:#000;border-radius:50%;top:9px;left:9px;box-shadow:2px 2px 0 #fff;}
.brows{position:absolute;top:-12px;left:0;right:0;height:16px;display:flex;justify-content:space-between;opacity:.75;}
.brow{width:30px;height:4px;background:var(--text);border-radius:2px;transform-origin:center;transition:all .25s ease;}
.talking .brow.l{transform:translateY(-4px) rotate(-4deg);}.talking .brow.r{transform:translateY(-4px) rotate(4deg);}
.thinking .brows{opacity:1;}.thinking .brow.l{transform:rotate(-14deg) translateX(-6px);}.thinking .brow.r{transform:rotate(14deg) translateX(6px);}
.mouth{position:absolute;bottom:6px;width:44px;height:10px;border-radius:8px;background:rgba(255,255,255,.15);opacity:.9;transition:all .18s;}
.talking .mouth{height:6px;background:var(--accent);box-shadow:0 0 18px var(--accent);}
.thinking .mouth{width:24px;height:14px;border-radius:7px;bottom:2px;background:transparent;border:2px solid var(--accent2);}
.char-status{margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:center;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 14px var(--warn);animation:pulse 2s infinite;}
.dot.ok{background:var(--ok);box-shadow:0 0 14px var(--ok);} .dot.danger{background:var(--danger);box-shadow:0 0 16px var(--danger);}
.dot.sleep{background:var(--muted);box-shadow:none;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.18);}}
.char-name{margin-top:10px;font-size:1.35rem;font-weight:700;letter-spacing:.3px;}
.char-sub{color:var(--dim);font-size:.9rem;text-align:center;padding:0 14px;}
/* 互动区 */
.chat{width:100%;max-width:520px;position:absolute;bottom:14px;right:14px;z-index:30;}
.msg{margin:8px 0;padding:10px 14px;border-radius:12px;max-width:88%;font-size:.86rem;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
.msg.me{background:var(--accent);color:#fff;margin-left:auto;text-align:right;border-bottom-right-radius:2px;}
.msg.bot{background:var(--surface);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:2px;}
.msg.sys{background:rgba(245,158,11,.2);color:#fde68a;border:1px solid rgba(245,158,11,.35);margin-left:auto;}
.typing{display:flex;gap:4px;padding:8px 0 4px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dot 1.4s infinite both;}
.typing span:nth-child(2){animation-delay:.2s;}.typing span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,80%,100%{transform:scale(0);opacity:.5;}40%{transform:scale(1);opacity:1;}}
/* 看板 (OS 监控) */
.board{position:absolute;left:26px;top:80px;width:310px;z-index:25;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;backdrop-filter:blur(10px);}
.panel h3{font-size:.85rem;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.metric{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.84rem;}
.metric:last-child{border:none;}
.metric .v{font-variant-numeric:tabular-nums;}
.ok{color:var(--ok);}.warn{color:var(--warn);}.danger{color:var(--danger);}
.bar{width:100%;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:4px;}
.bar span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.warnbar span{background:linear-gradient(90deg,var(--warn),var(--danger));}
/* todo 面板 */
.todo-panel{position:absolute;right:26px;top:80px;width:330px;z-index:25;}
.todo-panel h3{font-size:.9rem;color:var(--accent);margin-bottom:10px;}
.todo-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.todo-item.done{opacity:.6;text-decoration:line-through;}
.checkbox{width:18px;height:18px;border:2px solid var(--border);border-radius:6px;cursor:pointer;flex:0 0 18px;transition:.2s;}
.todo-item.done .checkbox{border-color:var(--ok);background:var(--ok);color:#fff;}
.todo-text{font-size:.84rem;line-height:1.4;color:var(--text);overflow:hidden;}
.todo-item.done .todo-text{color:var(--muted);}
.todo-meta{font-size:.72rem;color:var(--muted);margin-top:4px;}
.empty-todo{color:var(--muted);font-size:.82rem;text-align:center;padding:18px;}
/* 风格切换 */
.style-switch{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:35;}
.render-tip{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.66rem;color:var(--muted);letter-spacing:.3px;pointer-events:none;z-index:34;}
.btn{padding:9px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.82rem;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s;}
.btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.15);}
.btn.active{border-color:var(--accent);background:var(--accent);color:#fff;}
/* 开机 overlay */
.boot{position:fixed;inset:0;z-index:100;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease;}
.boot.hidden{opacity:0;pointer-events:none;}
.boot-logo{width:120px;height:120px;border-radius:24px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:36px;animation:scale 2s infinite alternate;}
@keyframes scale{from{transform:scale(1);}to{transform:scale(1.06);}}
.boot-prog{width:320px;height:6px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:22px;overflow:hidden;}
.boot-prog span{width:0%;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease;box-shadow:0 0 18px var(--accent);}
.boot-msg{margin-top:14px;color:var(--dim);font-size:.88rem;letter-spacing:.4px;}
.boot-tip{margin-top:8px;font-size:.72rem;color:var(--muted);}
/* 通知 */
.notice{position:fixed;bottom:96px;right:26px;z-index:50;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;color:var(--text);font-size:.84rem;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:slideIn .4s ease;}
@keyframes slideIn{from{transform:translateX(120px);opacity:0;}to{transform:none;opacity:1;}}
/* 设置面板 */
.settings{position:fixed;inset:0;z-index:60;background:rgba(3,4,8,.85);display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);}
.settings.panel-open{display:flex;}
.settings .card{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:32px 40px;max-width:460px;width:90vw;color:var(--text);}
.settings h2{margin-bottom:18px;font-size:1.2rem;}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.setting-row:last-child{border:none;}
.sw{position:relative;width:48px;height:24px;border-radius:12px;background:#1f2937;border:none;cursor:pointer;outline:none;}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
.sw.checked{background:var(--accent);} .sw.checked::after{transform:translateX(24px);}
.close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}

/* ── 状态条与动效 ── */
.state-bar{position:absolute;top:0;left:0;right:0;height:4px;z-index:10;background:rgba(255,255,255,.05);}
.state-bar .fill{height:100%;width:30%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:all .5s cubic-bezier(.4,0,.2,1);}
.state-bar.warn .fill{background:linear-gradient(90deg,var(--warn),var(--danger));}
.state-bar.sleep .fill{background:linear-gradient(90deg,#374151,#4b5563);}
.state-bar.ok .fill{background:linear-gradient(90deg,var(--ok),#4ade80);}

.avatar-wrap.idle #avatar{animation:breath 4s ease-in-out infinite;}
@keyframes breath{0%,100%{transform:scale(1) translateY(0);}50%{transform:scale(1.02) translateY(-4px);}}
.avatar-wrap.sleeping #avatar{animation:sleepBreathe 5s ease-in-out infinite;filter:grayscale(.3) drop-shadow(0 6px 24px rgba(0,0,0,.7));}
@keyframes sleepBreathe{0%,100%{transform:scale(.98) translateY(2px);}50%{transform:scale(1.01) translateY(-2px);}}
.avatar-wrap.talking #avatar{transform:scale(1.06);filter:drop-shadow(0 12px 32px rgba(99,102,241,.5));animation:pulseGlow 1.2s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.4);}50%{box-shadow:0 0 0 12px rgba(99,102,241,0);}}
.avatar-wrap.thinking #avatar{filter:blur(1px) drop-shadow(0 8px 20px rgba(168,85,247,.35));animation:thinkSway 2s ease-in-out infinite;}
@keyframes thinkSway{0%,100%{transform:rotate(0deg) scale(1);}25%{transform:rotate(2deg) scale(1.02);}75%{transform:rotate(-2deg) scale(1.02);}}
.avatar-wrap.executing #avatar{filter:drop-shadow(0 12px 32px rgba(34,197,94,.45));animation:execPulse .8s ease-in-out infinite;}
@keyframes execPulse{0%,100%{transform:scale(1.02);}50%{transform:scale(1.08);}}
.avatar-wrap.alert #avatar{filter:drop-shadow(0 0 20px rgba(239,68,68,.6));animation:alertShake .5s ease-in-out infinite;}
@keyframes alertShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

.ring{position:absolute;inset:-8px;border-radius:28px;pointer-events:none;opacity:0;transition:opacity .4s;}
.avatar-wrap.talking .ring{border:2px solid rgba(99,102,241,.4);opacity:1;animation:ringPulse 1.5s ease-out infinite;}
.avatar-wrap.thinking .ring{border:2px dashed rgba(168,85,247,.5);opacity:1;animation:spin 3s linear infinite;}
.avatar-wrap.executing .ring{border:3px solid rgba(34,197,94,.5);opacity:1;animation:ringPulse .6s ease-out infinite;}
.avatar-wrap.alert .ring{border:3px solid rgba(239,68,68,.6);opacity:1;animation:ringPulse .8s ease-out infinite;}
@keyframes ringPulse{0%{transform:scale(.95);opacity:.8;}100%{transform:scale(1.15);opacity:0;}}
@keyframes spin{to{transform:rotate(360deg);}}

.zzz{position:absolute;top:-10px;right:20px;font-size:1.4rem;color:var(--dim);opacity:0;font-weight:700;}
.avatar-wrap.sleeping .zzz{opacity:1;animation:zfloat 2s ease-in-out infinite;}
@keyframes zfloat{0%{transform:translateY(0) scale(.8);opacity:0;}30%{opacity:.9;}100%{transform:translateY(-30px) scale(1.2);opacity:0;}}

.think-bubble{position:absolute;top:-6px;right:-14px;width:34px;height:34px;border-radius:50%;background:var(--accent2);opacity:0;display:grid;place-items:center;font-size:18px;color:#fff;box-shadow:0 4px 14px rgba(168,85,247,.4);}
.avatar-wrap.thinking .think-bubble{opacity:1;animation:bubblePop .6s ease-out;}
@keyframes bubblePop{from{transform:scale(0);}to{transform:scale(1);}}
.think-bubble::after{content:'';position:absolute;bottom:-4px;left:8px;width:8px;height:8px;background:var(--accent2);border-radius:50%;}

.exec-icon{position:absolute;top:-6px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--ok);opacity:0;display:grid;place-items:center;font-size:16px;color:#000;font-weight:700;box-shadow:0 4px 14px rgba(34,197,94,.4);}
.avatar-wrap.executing .exec-icon{opacity:1;animation:spin .8s linear infinite;}

.alert-icon{position:absolute;top:-6px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--danger);opacity:0;display:grid;place-items:center;font-size:18px;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(239,68,68,.5);}
.avatar-wrap.alert .alert-icon{opacity:1;animation:bellShake .8s ease-in-out infinite;}
@keyframes bellShake{0%,100%{transform:rotate(0);}25%{transform:rotate(-15deg);}75%{transform:rotate(15deg);}}

.dot.think{background:var(--accent2);box-shadow:0 0 14px var(--accent2);}

/* 待办输入与快捷状态 */
.todo-input-row{display:flex;gap:6px;margin-bottom:10px;}
.todo-input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:.82rem;outline:none;}
.todo-input:focus{border-color:var(--accent);}
.todo-add{padding:8px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:.82rem;cursor:pointer;}
.todo-add:hover{background:#4f46e5;}
.todo-list{max-height:52vh;overflow-y:auto;padding-right:4px;}
.todo-item{animation:msgIn .3s ease;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted);}
.todo-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1;}
.todo-del:hover{color:var(--danger);}
.todo-total{font-size:.7rem;color:var(--muted);font-weight:400;}

.quick-states{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:35;}
.qs{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-size:.74rem;cursor:pointer;transition:.2s;}
.qs:hover{border-color:var(--accent2);color:var(--text);}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
</style>
</head>
<body class="wall-mode">
<canvas id="canvas"></canvas>
<div class="topbar">
  <div class="brand"><div class="logo">◆</div><div><div class="sys-time" id="t">--:--:--</div><div class="sys-date" id="d">加载中...</div></div></div>
  <div class="sys-stats" id="stats">CPU -% · MEM -% · DISK -% · NET --</div>
</div>
<div class="stage">
  <div class="char-card" id="card">
  <div class="state-bar" id="stateBar"><div class="fill" id="stateFill"></div></div>
  <div class="avatar-wrap" id="avatarWrap">
    <div class="ring"></div>
    <div class="zzz">Z</div>
    <div class="think-bubble">💡</div>
    <div class="exec-icon">⚙</div>
    <div class="alert-icon">!</div>
    <div class="face" id="face" style="display:none"><div class="eyes"><div class="eye l"></div><div class="eye r"></div></div><div class="brows"><div class="brow l"></div><div class="brow r"></div></div><div class="mouth"></div></div>
    <canvas id="charCanvas" width="220" height="220" style="display:block;" title="可把 .vrm / .glb 模型文件拖到这里替换角色"></canvas>
    </div>
    <div class="char-status"><span class="dot ok" id="dot"></span><span id="statusText">待命中</span></div>
    <div class="char-name" id="name">小助手</div>
    <div class="char-sub" id="sub">随时待命 · 多风格支持</div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="board" id="board">
    <div class="panel"><h3>系统监控 <span id="dotOS" class="dot ok" style="width:6px;height:6px;"></span></h3>
      <div class="metric"><span>CPU</span><span class="v" id="mCpu">--</span></div><div class="bar"><span id="bCpu"></span></div>
      <div class="metric"><span>内存</span><span class="v" id="mMem">--</span></div><div class="bar"><span id="bMem"></span></div>
      <div class="metric"><span>磁盘 /</span><span class="v" id="mDisk">--</span></div><div class="bar"><span id="bDisk"></span></div>
      <div class="metric"><span>网络</span><span class="v" id="mNet">--</span></div>
      <div class="metric"><span>异常登录</span><span class="v danger" id="mLogin">无</span></div>
    </div>
  </div>
  <div class="todo-panel" id="todoPanel">
    <div class="panel">
      <h3>今日代办 <span class="todo-total" id="prog">0/0</span></h3>
      <div class="todo-input-row">
        <input class="todo-input" id="todoInput" type="text" placeholder="添加待办… 回车提交" maxlength="80">
        <button class="todo-add" id="todoAdd">+</button>
      </div>
      <div class="todo-list" id="todoList"><div class="empty-todo">加载待办中...</div></div>
    </div>
  </div>
  <div class="quick-states" id="quickStates">
    <button class="qs" onclick="setState('sleeping')">😴 睡眠</button>
    <button class="qs" onclick="setState('talking')">💬 对话</button>
    <button class="qs" onclick="setState('thinking')">🤔 思考</button>
    <button class="qs" onclick="setState('executing')">⚙ 执行</button>
    <button class="qs" onclick="startVoice()" style="color:var(--accent2);border-color:var(--accent2);">🎤 语音</button>
  </div>
  <div class="style-switch" id="styleSwitch">
    <button class="btn active" data-style="manus" onclick="setStyle(this,'manus')">Manus 像素玩偶</button>
    <button class="btn" data-style="hot" onclick="setStyle(this,'hot')">Hot 世界小姐</button>
    <button class="btn" data-style="hard" onclick="setStyle(this,'hard')">硬核男人</button>
    <button class="btn" id="btn3d" onclick="toggle3D()" title="切换 three.js 3D 立绘 / canvas 2D 渲染">3D 立绘</button>
  </div>
  <div class="render-tip" id="renderTip"></div>
</div>
<div class="boot" id="boot">
  <div class="boot-logo">◆</div>
  <div class="boot-prog"><span id="bootBar"></span></div>
  <div class="boot-msg" id="bootMsg">系统初始化中…</div>
  <div class="boot-tip">Manus Agent · 桌面助手</div>
</div>
<div class="notice" id="notice" style="display:none;"></div>

  <button class="close" onclick="closeSettings()">×</button>
  <div class="card">

    <div class="setting-row"><span>代办提醒</span><button class="sw checked" id="swTodo" onclick="toggle(this,'todo')"></button></div>

  </div>

<script>
const API='http://127.0.0.1:8765';
let currentStyle='manus';
let ttsEnabled=false, loginAlert=true, todoAlert=true;
let curState='idle';
let idleTimer=null;

// 粒子背景
(function(){
  const c=document.getElementById('canvas'),x=c.getContext('2d');
  let w,h,pts=[];
  function r(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
  window.addEventListener('resize',r);r();
  for(let i=0;i<70;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*.4,vy:(Math.random()-0.5)*.4,r:Math.random()*1.5+0.5,a:Math.random()});
  function draw(){
    x.clearRect(0,0,w,h);
    x.fillStyle='#1f2937';
    for(let p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.globalAlpha=p.a;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();}
    requestAnimationFrame(draw);
  }draw();
})();

// 时钟
(function tick(){const n=new Date();document.getElementById('t').textContent=n.toLocaleTimeString('zh-CN',{hour12:false});document.getElementById('d').textContent=n.toLocaleDateString('zh-CN',{weekday:'short',month:'numeric',day:'numeric'});setTimeout(tick,1000);})();

// ── 四状态动效引擎 ─────────────────────────────────────
const STATE_UI={
  idle:      {cls:'idle',      dot:'',         text:'待命中',   bar:'',       fill:'30%'},
  sleeping:  {cls:'sleeping', dot:'sleep',    text:'休眠中',   bar:'sleep',  fill:'20%'},
  talking:   {cls:'talking',  dot:'ok',       text:'对话中',   bar:'',       fill:'60%'},
  thinking:  {cls:'thinking', dot:'think',    text:'思考中…',  bar:'warn',   fill:'45%'},
  executing: {cls:'executing',dot:'ok',       text:'执行任务', bar:'ok',     fill:'75%'},
  alert:     {cls:'alert',    dot:'danger',   text:'安全预警', bar:'warn',   fill:'90%'},
};
function setState(s){
  curState=s;
  const u=STATE_UI[s]||STATE_UI.idle;
  const w=document.getElementById('avatarWrap');
  Object.values(STATE_UI).forEach(x=>w.classList.remove(x.cls));
  w.classList.add(u.cls);
  const bar=document.getElementById('stateBar');
  bar.className='state-bar '+(u.bar||'');
  document.getElementById('stateFill').style.width=u.fill;
  document.getElementById('dot').className='dot '+(u.dot||'');
  document.getElementById('statusText').textContent=u.text;
  clearTimeout(idleTimer);
  if(s!=='idle'&&s!=='sleeping'){
    idleTimer=setTimeout(()=>setState('idle'),12000);
  }
  if(window.pokeChar)window.pokeChar(); // 状态切换 → 预备动作(弹一下)
}

// ══════════════════════════════════════════════════════════════════
//  二次元桌宠渲染引擎（参考 AniMate 桌宠 / 3D 卡通渲染）
//  全身立绘 + cel-shading 分层明暗 + 边缘光 + 地面投影 + 视差
//  呼吸起伏 · 随机眨眼 · 视线/头部跟随 · 头发&裙摆&手臂弹簧跟随(过冲)
//  squash & stretch · 状态切换预备动作 · 表情状态机
// ══════════════════════════════════════════════════════════════════
const CHAR_SKIN={
  manus:{hair:'#8f7cf5',hairDark:'#5646c7',hairLit:'#d3c8ff',eyeTop:'#312a9c',eyeBot:'#5eead4',skin:'#ffe4d4',skinShade:'#f0bdA6',blush:'#ff8fa8',cloth:'#4f46e5',clothDark:'#2c2a78',lash:'#3b2f8f'},
  hot:  {hair:'#ff9ecd',hairDark:'#be5a97',hairLit:'#ffdcef',eyeTop:'#831843',eyeBot:'#fda4af',skin:'#ffe8de',skinShade:'#f3c2b1',blush:'#ff6f91',cloth:'#db2777',clothDark:'#8d1546',lash:'#a13a6d'},
  hard: {hair:'#98a2b3',hairDark:'#3f4a5c',hairLit:'#e2e8f0',eyeTop:'#7f1d1d',eyeBot:'#fb923c',skin:'#f0d8c6',skinShade:'#d3ac93',blush:'#c96a72',cloth:'#334155',clothDark:'#111c30',lash:'#3f4a5a'},
};
let PAL=CHAR_SKIN.manus;
let MODE3D=false;                                   // true=three.js 3D 渲染，false=canvas 2D

const cvsEl=document.getElementById('charCanvas');
const cg=cvsEl.getContext('2d');
const CW=260, CH=372, DPR=Math.min(window.devicePixelRatio||1,2);
cvsEl.width=CW*DPR; cvsEl.height=CH*DPR;
cvsEl.style.width=CW+'px'; cvsEl.style.height=CH+'px';

// 全身骨架关键高度（脚底 y=0，向上为负）
const SK={head:-268,neck:-230,sh:-214,waist:-152,hip:-150,knee:-76,foot:-8};
const HEAD_S=0.62;                       // 头部缩放 → 约 3.4 头身 chibi

const PET={
  t:0, popT:9, popOn:false,
  look:{x:0,y:0}, lookT:{x:0,y:0}, head:{x:0,y:0},
  hair:{a:0,v:0}, side:{a:0,v:0}, ahoge:{a:0,v:0},
  mouth:{a:0,v:0}, bounce:{a:0,v:0},
  armL:{a:0,v:0}, armLb:{a:0,v:0}, armR:{a:0,v:0}, armRb:{a:0,v:0},
  skirt:{a:0,v:0},
  blink:0, blinkT:1.4, blinkP:-1, happy:0, parts:[],
};
const _ease=x=>x*x*(3-2*x);
const _clamp=(v,a,b)=>v<a?a:v>b?b:v;
function _spring(s,target,stiff,damp,dt){s.v+=((target-s.a)*stiff-s.v*damp)*dt;s.a+=s.v*dt;}
function _spawnFx(n,kind){
  for(let i=0;i<n;i++)PET.parts.push({x:(Math.random()-.5)*96,y:SK.head-10-Math.random()*60,
    vx:(Math.random()-.5)*52,vy:-38-Math.random()*44,life:1,r:2+Math.random()*2,kind});
}
window.pokeChar=function(){PET.popT=0;PET.popOn=true;_spawnFx(6,'star');if(window.PET3D&&PET3D.ready)PET3D.poke();};

function updatePet(dt){
  dt=_clamp(dt||0.016,0.001,0.05);
  PET.t+=dt;
  const sleep=curState==='sleeping',talk=curState==='talking',
        think=curState==='thinking',exec=curState==='executing',alert=curState==='alert';

  // ① 眨眼：随机间隔，快闭慢睁
  PET.happy=Math.max(0,PET.happy-dt*0.55);
  if(sleep){PET.blink=1;PET.blinkP=-1;}
  else{
    PET.blinkT-=dt;
    if(PET.blinkT<=0&&PET.blinkP<0){PET.blinkP=0;PET.blinkT=1.6+Math.random()*3.6;}
    if(PET.blinkP>=0){
      PET.blinkP+=dt;
      PET.blink=PET.blinkP<0.085?_ease(PET.blinkP/0.085)
               :PET.blinkP<0.225?1-_ease((PET.blinkP-0.085)/0.14):0;
      if(PET.blinkP>0.225)PET.blinkP=-1;
    }
  }

  // ② 视线 + 头部朝向：缓动追踪，思考时抬眼
  const lx=PET.lookT.x, ly=think?PET.lookT.y-0.45:alert?PET.lookT.y+0.1:PET.lookT.y;
  PET.look.x+=(lx-PET.look.x)*Math.min(1,dt*7);
  PET.look.y+=(ly-PET.look.y)*Math.min(1,dt*7);
  const hx=sleep?0:talk?lx*0.45+Math.sin(PET.t*3.1)*0.10:lx*0.6;
  const hy=sleep?0.22:ly*0.5;
  PET.head.x+=(hx-PET.head.x)*Math.min(1,dt*3.4);
  PET.head.y+=(hy-PET.head.y)*Math.min(1,dt*3.4);

  // ③ 弹簧跟随：头发 / 裙摆 / 双臂（滞后 + 过冲）
  _spring(PET.hair ,-PET.head.x*0.26+Math.sin(PET.t*1.10)*0.02,110,9.5,dt);
  _spring(PET.side ,-PET.head.x*0.42+Math.sin(PET.t*1.35+1)*0.03, 82,7.6,dt);
  _spring(PET.ahoge,-PET.head.x*0.90+Math.sin(PET.t*1.90)*0.10, 54,4.8,dt);
  _spring(PET.skirt,-PET.head.x*0.34+Math.sin(PET.t*0.62+1.2)*0.02,60,7.0,dt);
  const sway=Math.sin(PET.t*0.62);
  const pose={
    idle:  {A: 0.13+sway*0.03, B: 0.10+sway*0.05},
    talk:  {A: 0.16+Math.sin(PET.t*6.2)*0.10, B:-0.30-Math.abs(Math.sin(PET.t*6.2))*0.22},
    think: {A: 2.55, B:-1.15},
    exec:  {A: 0.50, B:-0.95},
    alert: {A: 0.35, B:-0.55},
    sleep: {A: 0.04, B: 0.04},
  };
  const P0=sleep?pose.sleep:think?pose.think:exec?pose.exec:alert?pose.alert:talk?pose.talk:pose.idle;
  const lA=think?0.14:P0.A, lB=think?0.10:P0.B;   // 思考时只抬一侧手臂
  _spring(PET.armL ,lA+sway*0.02, 70,8.6,dt);
  _spring(PET.armR ,P0.A-sway*0.02, 70,8.6,dt);
  _spring(PET.armLb,lB, 70,8.6,dt);
  _spring(PET.armRb,P0.B, 70,8.6,dt);

  // ④ 嘴部开合
  let mT=0;
  if(talk)      mT=0.45+0.42*Math.abs(Math.sin(PET.t*13.5));
  else if(alert)mT=0.34+0.18*Math.abs(Math.sin(PET.t*7));
  else if(exec) mT=0.22;
  else if(think)mT=0.10;
  else if(sleep)mT=0.05;
  _spring(PET.mouth,mT,240,21,dt);

  // ⑤ 呼吸 + 弹跳 + 状态切换挤压拉伸
  _spring(PET.bounce,0,170,13,dt);
  if(PET.popOn){PET.popT+=dt;if(PET.popT>1.3)PET.popOn=false;}
  const pop=PET.popOn?Math.sin(PET.popT*17)*Math.exp(-PET.popT*5.5):0;
  const br=Math.sin(PET.t*(sleep?0.85:exec?2.1:1.45));
  const squint=Math.max(PET.blink,PET.happy*0.55);

  for(let i=PET.parts.length-1;i>=0;i--){
    const p=PET.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt*0.85;
    if(p.life<=0)PET.parts.splice(i,1);
  }

  return {sleep,talk,think,exec,alert,squint,br,pop};
}

function drawChar2D(view,dt){
  const {sleep,talk,think,exec,alert,squint,br,pop}=view;
  // ══════ 绘制 ══════
  const g=cg;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,CW,CH);
  const sp=g.createRadialGradient(CW/2,CH*0.66,10,CW/2,CH*0.66,CH*0.52);
  sp.addColorStop(0,'rgba(99,102,241,.18)');sp.addColorStop(1,'rgba(99,102,241,0)');
  g.fillStyle=sp;g.fillRect(0,0,CW,CH);

  g.save();
  g.translate(CW/2,CH-18);                                   // 脚底锚点
  g.scale(1-0.010*br-0.045*pop+0.012*PET.happy, 1+0.014*br+0.07*pop); // squash & stretch（以脚为支点）
  g.translate(0,PET.bounce.a*0.22);
  drawFullBody(g,squint,talk,think,exec,alert,sleep,br);
  drawFx(g,think,exec,alert,sleep);
  g.restore();
}

// ── cel-shading 零件：底色 + 硬边暗部 + 边缘光 + 外轮廓 ──
function part(g,pathFn,base,bb){
  g.save();
  pathFn(g);g.fillStyle=base;g.fill();
  g.save();g.clip();
  const sh=g.createLinearGradient(bb.x,0,bb.x+bb.w,0);
  sh.addColorStop(0,'rgba(255,255,255,.18)');
  sh.addColorStop(.28,'rgba(255,255,255,0)');
  sh.addColorStop(.58,'rgba(0,0,0,0)');
  sh.addColorStop(.59,'rgba(14,8,38,.30)');
  sh.addColorStop(1,'rgba(14,8,38,.44)');
  g.fillStyle=sh;g.fillRect(bb.x,bb.y,bb.w,bb.h);
  const rg=g.createLinearGradient(bb.x+bb.w,bb.y,bb.x,bb.y+bb.h);
  rg.addColorStop(0,'rgba(255,255,255,.34)');rg.addColorStop(.42,'rgba(255,255,255,0)');
  g.strokeStyle=rg;g.lineWidth=5;pathFn(g);g.stroke();
  g.restore();
  g.strokeStyle='rgba(18,10,38,.34)';g.lineWidth=1.5;pathFn(g);g.stroke();
  g.restore();
}
// ── 圆柱状肢体：沿法线方向的明暗渐变 ──
function limb(g,x0,y0,x1,y1,w,base){
  g.save();g.lineCap='round';
  g.strokeStyle=base;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  const a=Math.atan2(y1-y0,x1-x0),nx=Math.cos(a-Math.PI/2),ny=Math.sin(a-Math.PI/2);
  const gr=g.createLinearGradient(x0+nx*w*.5,y0+ny*w*.5,x0-nx*w*.5,y0-ny*w*.5);
  gr.addColorStop(0,'rgba(255,255,255,.24)');gr.addColorStop(.42,'rgba(255,255,255,0)');
  gr.addColorStop(.60,'rgba(0,0,0,0)');gr.addColorStop(.61,'rgba(14,8,38,.26)');
  gr.addColorStop(1,'rgba(14,8,38,.40)');
  g.strokeStyle=gr;g.stroke();
  g.restore();
}

// ── 全身：腿 → 裙 → 躯干 → 手臂 → 头 ──
function drawFullBody(g,squint,talk,think,exec,alert,sleep,br){
  const sway=Math.sin(PET.t*0.62)*2.4;                       // 重心慢摆
  const lean=PET.head.x*0.06;

  // 地面投影（随呼吸/弹跳缩放）
  const shR=50*(1+0.02*br)-PET.bounce.a*0.05;
  g.save();
  const shg=g.createRadialGradient(0,-2,3,0,-2,Math.max(20,shR));
  shg.addColorStop(0,'rgba(0,0,0,.5)');shg.addColorStop(.55,'rgba(0,0,0,.18)');shg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=shg;g.beginPath();g.ellipse(0,-3,Math.max(20,shR),Math.max(8,shR*0.28),0,0,Math.PI*2);g.fill();
  g.restore();

  // 腿 + 鞋
  for(const s of [-1,1]){
    const hx=s*17, kx=s*15+sway*0.5, ax=s*12+sway*0.9;
    part(g,function(p){
      p.beginPath();
      p.moveTo(hx-15,SK.hip+8);
      p.bezierCurveTo(hx-17,SK.hip-24,kx-16,SK.knee-16,kx-14,SK.knee);
      p.bezierCurveTo(kx-15,SK.knee+22,ax-12,SK.foot-26,ax-10,SK.foot-9);
      p.lineTo(ax+10,SK.foot-9);
      p.bezierCurveTo(ax+12,SK.foot-26,kx+15,SK.knee+22,kx+14,SK.knee);
      p.bezierCurveTo(kx+16,SK.knee-16,hx+17,SK.hip-24,hx+15,SK.hip+8);
      p.closePath();
    },PAL.skin,{x:hx-22,y:SK.hip-6,w:44,h:SK.foot+12-(SK.hip-6)});
    part(g,function(p){                                       // 鞋
      p.beginPath();
      p.moveTo(ax-11,SK.foot-10);p.lineTo(ax+11,SK.foot-10);
      p.bezierCurveTo(ax+15,SK.foot-2,ax+18,SK.foot+1,ax+5,SK.foot+2);
      p.lineTo(ax-12,SK.foot+2);
      p.bezierCurveTo(ax-16,SK.foot+1,ax-15,SK.foot-5,ax-11,SK.foot-10);
      p.closePath();
    },PAL.clothDark,{x:ax-20,y:SK.foot-12,w:40,h:SK.foot+6-(SK.foot-12)});
  }

  // 裙摆（滞后摆动）
  g.save();
  g.translate(0,SK.waist);g.rotate(PET.skirt.a*0.55);g.translate(0,-SK.waist);
  part(g,function(p){
    p.beginPath();
    p.moveTo(-25,SK.waist-4);
    p.bezierCurveTo(-42,SK.waist+16,-47,SK.hip+34,-45,SK.hip+44);
    p.quadraticCurveTo(-31,SK.hip+54,-17,SK.hip+43);
    p.quadraticCurveTo(-6,SK.hip+54,5,SK.hip+43);
    p.quadraticCurveTo(19,SK.hip+54,31,SK.hip+43);
    p.quadraticCurveTo(42,SK.hip+52,45,SK.hip+44);
    p.bezierCurveTo(47,SK.hip+34,42,SK.waist+16,25,SK.waist-4);
    p.closePath();
  },PAL.clothDark,{x:-50,y:SK.waist-8,w:100,h:SK.hip+58-(SK.waist-8)});
  g.save();g.globalAlpha=.30;g.strokeStyle='#1a1030';g.lineWidth=2;
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*9,SK.waist+2);g.quadraticCurveTo(i*13,SK.hip+22,i*15,SK.hip+42);g.stroke();}
  g.restore();
  g.restore();

  // 上半身（绕腰轻微倾斜 → 视差）
  g.save();
  g.translate(0,SK.waist);g.rotate(lean);g.translate(0,-SK.waist);

  drawArm(g,-1,PET.armR.a,PET.armRb.a);                        // 远侧手臂先画，肩头被躯干压住 → 前后层次

  part(g,function(p){                                          // 脖子
    p.beginPath();p.moveTo(-11,SK.neck);p.lineTo(11,SK.neck);
    p.lineTo(13,SK.sh+4);p.lineTo(-13,SK.sh+4);p.closePath();
  },PAL.skinShade,{x:-16,y:SK.neck-4,w:32,h:SK.sh+8-(SK.neck-4)});

  part(g,function(p){                                          // 躯干/外套
    p.beginPath();
    p.moveTo(-31,SK.sh+8);
    p.bezierCurveTo(-36,SK.sh-4,-22,SK.sh-13,-12,SK.sh-15);
    p.lineTo(12,SK.sh-15);
    p.bezierCurveTo(22,SK.sh-13,36,SK.sh-4,31,SK.sh+8);
    p.bezierCurveTo(29,SK.waist-6,27,SK.waist+8,25,SK.waist+14);
    p.lineTo(-25,SK.waist+14);
    p.bezierCurveTo(-27,SK.waist+8,-29,SK.waist-6,-31,SK.sh+8);
    p.closePath();
  },PAL.cloth,{x:-40,y:SK.sh-18,w:80,h:SK.waist+18-(SK.sh-18)});

  part(g,function(p){                                          // V 领
    p.beginPath();p.moveTo(-13,SK.sh-12);p.lineTo(0,SK.sh+14);
    p.lineTo(13,SK.sh-12);p.quadraticCurveTo(0,SK.sh-16,-13,SK.sh-12);p.closePath();
  },PAL.skinShade,{x:-16,y:SK.sh-16,w:32,h:34});
  g.fillStyle=PAL.blush;                                       // 领结
  g.beginPath();g.moveTo(-6,SK.sh-6);g.lineTo(-17,SK.sh-11);g.lineTo(-17,SK.sh+1);g.closePath();g.fill();
  g.beginPath();g.moveTo(6,SK.sh-6);g.lineTo(17,SK.sh-11);g.lineTo(17,SK.sh+1);g.closePath();g.fill();
  g.fillStyle=PAL.hairLit;g.beginPath();g.arc(0,SK.sh-6,3.6,0,Math.PI*2);g.fill();

  drawArm(g,1,PET.armL.a,PET.armLb.a);                         // 近侧手臂压在躯干之上

  // 头（复用近景表情系统，整体缩放为 chibi 头身比）
  g.save();
  g.translate(PET.head.x*4.5, SK.head+(sleep?7:0)+br*1.5);
  g.rotate(PET.head.x*0.16+PET.happy*0.05*Math.sin(PET.t*8)+(sleep?0.13:0));
  g.scale(HEAD_S,HEAD_S);
  drawHairBack(g);
  drawFace(g);
  drawEyes(g,squint);
  drawBlush(g,sleep);
  drawMouth(g,talk,think,exec,alert,sleep);
  drawHairFront(g);
  drawBrows(g,think,exec,alert,sleep);
  g.restore();

  g.restore();
}

// ── 手臂：上臂(袖) + 前臂(皮肤) + 手 ──
function drawArm(g,s,A,B){
  const L1=34,L2=32;
  const sx=s*29, sy=SK.sh+6;
  const ex=sx+s*Math.sin(A)*L1, ey=sy+Math.cos(A)*L1;
  const hx=ex+s*Math.sin(B)*L2, hy=ey+Math.cos(B)*L2;
  limb(g,sx,sy,ex,ey,23,PAL.cloth);
  limb(g,ex,ey,hx,hy,17,PAL.skin);
  g.save();
  g.fillStyle=PAL.skin;g.beginPath();g.arc(hx,hy,9,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.arc(hx-2.5,hy-3,5,0,Math.PI*2);g.fill();
  g.restore();
}

function drawFace(g){

  g.fillStyle=sg;
  g.beginPath();
  g.moveTo(-w,-h*0.10);
  g.bezierCurveTo(-w*1.03,h*0.42,-w*0.60,h*0.98,0,h*1.02);
  g.bezierCurveTo(w*0.60,h*0.98,w*1.03,h*0.42,w,-h*0.10);
  g.bezierCurveTo(w*1.02,-h*0.86,w*0.55,-h*1.12,0,-h*1.12);
  g.bezierCurveTo(-w*0.55,-h*1.12,-w*1.02,-h*0.86,-w,-h*0.10);

// ── 眼睛：大眼 + 渐变虹膜 + 双层高光 + 睫毛，眨眼时纵向压扁 ──
function drawEyes(g,squint){
  const open=1-squint;
  for(const s of [-1,1]){
    const ex=s*25, ey=2;
    if(open<0.14){                                 // 闭眼 / 开心眯眼 ^ ^
      g.strokeStyle=PAL.lash;g.lineWidth=4.6;g.lineCap='round';
      const up=PET.happy>0.2;
      g.beginPath();g.moveTo(ex-14,ey-3);
      g.quadraticCurveTo(ex,ey+(up?-9:9),ex+14,ey-3);g.stroke();
      g.lineWidth=3;
      g.beginPath();g.moveTo(ex+s*13,ey-1);g.lineTo(ex+s*19,ey-5);g.stroke();
      continue;
    }
    const h=26*open+1;
    g.beginPath();                                 // 杏仁眼形
    g.moveTo(ex-15,ey+2);
    g.bezierCurveTo(ex-13,ey-h*0.80,ex+13,ey-h*0.80,ex+15,ey+2);
    g.bezierCurveTo(ex+10,ey+h*0.52,ex-10,ey+h*0.52,ex-15,ey+2);
    g.closePath();
    g.save();g.clip();
    g.fillStyle='#fdfaff';g.fill();
    const ix=ex+PET.look.x*5.2, iy=ey-1+PET.look.y*4.0;
    const ig=g.createLinearGradient(ix,iy-13,ix,iy+13);
    ig.addColorStop(0,PAL.eyeTop);ig.addColorStop(1,PAL.eyeBot);
    g.fillStyle=ig;
    g.beginPath();g.ellipse(ix,iy,10.5,13,0,0,Math.PI*2);g.fill();
    g.fillStyle='#100a24';
    g.beginPath();g.ellipse(ix,iy,5.2,7.2,0,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(255,255,255,.95)';
    g.beginPath();g.ellipse(ix-4,iy-6,4.4,5.6,-0.4,0,Math.PI*2);g.fill();
    g.globalAlpha=.75;
    g.beginPath();g.ellipse(ix+4.5,iy+6,2.2,2.8,0,0,Math.PI*2);g.fill();
    g.globalAlpha=1;
    const sg=g.createLinearGradient(0,ey-h*0.7,0,ey+h*0.2);   // 上眼睑投影
    sg.addColorStop(0,'rgba(0,0,0,.38)');sg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sg;g.fillRect(ex-16,ey-h,32,h*1.2);
    g.restore();
    g.strokeStyle=PAL.lash;g.lineWidth=5;g.lineCap='round';   // 上睫毛
    g.beginPath();
    g.moveTo(ex-15,ey+2);
    g.bezierCurveTo(ex-13,ey-h*0.80,ex+13,ey-h*0.80,ex+15,ey+2);
    g.stroke();
    g.lineWidth=3.4;                                          // 外眼角上挑
    g.beginPath();g.moveTo(ex+s*14,ey+1);g.quadraticCurveTo(ex+s*20,ey-3,ex+s*23,ey-8);g.stroke();
    g.strokeStyle='rgba(60,40,80,.32)';g.lineWidth=1.6;       // 下眼睑
    g.beginPath();g.moveTo(ex-13,ey+h*0.42);g.quadraticCurveTo(ex,ey+h*0.62,ex+13,ey+h*0.42);g.stroke();
  }
}

// ── 眉毛：思考压内、执行下压、预警上挑、安睡舒展 ──
function drawBrows(g,think,exec,alert,sleep){

  if(think){inn=-5;out=1;} else if(exec){inn=5;out=-1;} else if(alert){inn=-4;out=-4;} else if(sleep){inn=2;out=1;}
  for(const s of [-1,1]){
    g.strokeStyle=PAL.lash;g.lineWidth=3.4;g.lineCap='round';
    g.beginPath();
    g.moveTo(s*25-13,-26-out);
    g.quadraticCurveTo(s*25,-29-inn*0.4,s*25+13,-26-inn);
    g.stroke();
  }
}

function drawBlush(g,sleep){

function drawMouth(g,talk,think,exec,alert,sleep){
  const y=36;
  g.save();g.lineCap='round';g.lineWidth=3;
  g.strokeStyle='rgba(140,60,80,.9)';g.fillStyle='#8f2f4d';
  const o=_clamp(PET.mouth.a,0,1);
  if(talk){                                        // 说话：开合 + 舌头
    const hh=5+18*o;
    g.beginPath();g.ellipse(0,y+hh*0.25,10,hh*0.5+2,0,0,Math.PI*2);g.fill();
    g.fillStyle=PAL.blush;
    g.beginPath();g.ellipse(0,y+hh*0.62,6.5,hh*0.3,0,0,Math.PI);g.fill();
  } else if(exec){                                 // 执行：自信笑
    const hh=4+11*o;
    g.beginPath();g.moveTo(-12,y-3);g.quadraticCurveTo(0,y-5,12,y-3);
    g.quadraticCurveTo(0,y+hh+4,-12,y-3);g.fill();
  } else if(alert){                                // 预警：小 o
    g.beginPath();g.ellipse(0,y+2,6,4+5*o,0,0,Math.PI*2);g.fill();
  } else if(think){                                // 思考：抿嘴偏一边
    g.beginPath();g.moveTo(-3,y+1);g.lineTo(11,y-3);g.stroke();
  } else if(sleep){                                // 安睡
    g.beginPath();g.moveTo(-8,y-1);g.quadraticCurveTo(0,y+5,8,y-1);g.stroke();
  } else {                                         // 待命：浅笑（开心时放大）
    g.beginPath();g.moveTo(-11,y-2);g.quadraticCurveTo(0,y+5+PET.happy*6,11,y-2);g.stroke();
  }
  g.restore();
}

  g.save();                                        // 刘海

  g.moveTo(-58,-12);

  g.lineTo(11,-6);g.lineTo(0,-14);g.lineTo(-11,-6);g.lineTo(-21,-18);
  g.lineTo(-31,-6);g.lineTo(-41,-20);g.lineTo(-49,-8);

// ── 状态特效：思考泡 / 执行火花 / 预警汗滴 / 安睡 Z / 粒子 ──
function drawFx(g,think,exec,alert,sleep){
  const hy=SK.head;
  if(think){
    for(let i=0;i<3;i++){const p=(PET.t*0.9+i*0.33)%1;
      g.save();g.globalAlpha=1-p;g.fillStyle='#c4b5fd';
      g.beginPath();g.arc(-56+i*9,hy-16-p*14,3.4-i*0.6,0,Math.PI*2);g.fill();g.restore();}
  }
  if(exec){
    for(let i=0;i<3;i++){const p=(PET.t*1.2+i*0.34)%1,a=p*Math.PI*2;
      g.save();g.globalAlpha=1-p;g.fillStyle='#86efac';
      g.beginPath();g.arc(Math.cos(a)*58,-150+Math.sin(a)*60,2.8,0,Math.PI*2);g.fill();g.restore();}
  }
  if(alert){
    const p=(PET.t%1.8)/1.8;
    g.save();g.globalAlpha=1-p;g.fillStyle='#7dd3fc';
    g.beginPath();g.ellipse(34,hy+26+p*34,4,7,0,0,Math.PI*2);g.fill();g.restore();
  }
  if(sleep){
    for(let i=0;i<3;i++){const p=(PET.t*0.55+i*0.34)%1;
      g.save();g.globalAlpha=1-p;g.fillStyle='#cbd5e1';
      g.font='bold '+(11+i*4)+'px system-ui,sans-serif';
      g.fillText('z',46+p*16,hy-14-p*30);g.restore();}
  }
  for(const p of PET.parts){
    g.save();g.globalAlpha=Math.max(0,p.life);g.translate(p.x,p.y);
    if(p.kind==='heart'){
      g.fillStyle='#ff7a9c';g.beginPath();
      g.moveTo(0,4);g.bezierCurveTo(-7,-3,-3.4,-9,0,-4.6);
      g.bezierCurveTo(3.4,-9,7,-3,0,4);g.fill();
    }else{
      g.fillStyle='#fff6c9';g.beginPath();
      for(let i=0;i<8;i++){const r=i%2?p.r*0.45:p.r*1.9,a=i*Math.PI/4;
        const X=Math.cos(a)*r,Y=Math.sin(a)*r;i?g.lineTo(X,Y):g.moveTo(X,Y);}
      g.closePath();g.fill();
    }
    g.restore();
  }
}

// todo
async function fetchTodo(){
  try{
    const r=await fetch(API+'/todo',{cache:'no-store'});
    const j=await r.json();
    const el=document.getElementById('todoList');
    el.innerHTML='';
    let done=0;
    const items=(j.items||[]).sort((a,b)=>a.done-b.done||(b.due||'').localeCompare(a.due||''));
    for(const t of items){
      if(t.done)done++;
      const it=document.createElement('div');
      it.className='todo-item'+(t.done?' done':'');
      it.innerHTML=
        `<div class="checkbox" onclick="toggleTodo('${t.id}',${!t.done})">${t.done?'✓':''}</div>`+
        `<div style="flex:1;min-width:0"><div class="todo-text">${esc(t.title)}</div>`+
        `<div class="todo-meta">${esc(t.due||'无截止日期')} · ${esc(t.cat||'一般')}</div></div>`+
        `<button class="todo-del" onclick="delTodo('${t.id}')" title="删除">×</button>`;
      el.appendChild(it);
    }
    if(!items.length)el.innerHTML='<div class="empty-todo">今日暂无代办，底部输入添加</div>';
    document.getElementById('prog').textContent=`${done}/${items.length}`;
  }catch(e){}
}
async function addTodo(){
  const input=document.getElementById('todoInput');
  const title=input.value.trim();
  if(!title)return;
  input.value='';
  setState('executing');
  try{
    const r=await fetch(API+'/todo/add',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,due:new Date().toISOString().slice(0,10),cat:'一般'})
    });
    const j=await r.json();
    if(j.ok){
      say('已添加待办：'+title,'act');
      setState('executing');
      setTimeout(()=>{setState('idle');fetchTodo();},800);
    }
  }catch(e){say('添加失败，请检查守护进程。','sys');setState('idle');}
}

      body:JSON.stringify({id,done})});

}

// ── 语音引擎（Web Speech STT + TTS + 频谱口型同步） ─────────────
let voiceActive=false, analyserNode=null, micCtx=null;
function startVoice(){
  if(voiceActive){say('语音已在监听中。','sys');return;}
  say('🎤 正在监听… 请说话。','sys');
  voiceActive=true; setState('talking');
  try{
    // STT: SpeechRecognition
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){
      const rec=new SR();
      rec.lang='zh-CN'; rec.interimResults=true; rec.maxAlternatives=1;
      rec.onresult=e=>{
        const transcript=Array.from(e.results).map(r=>r[0].transcript).join('');
        if(transcript.trim().length>2){
          document.getElementById('chatInput').value=transcript;
          chat();
        }
      };
      rec.onerror=e=>{say('语音识别出错：'+e.error,'sys');setState('idle');voiceActive=false;};
      rec.onend=()=>{setTimeout(()=>{if(voiceActive)setState('idle');voiceActive=false;},1500);};
      rec.start();
    }
    // TTS + 频谱分析（若支持）
    const synth=window.speechSynthesis;
    if(synth){
      try{
        micCtx=new (window.AudioContext||window.webkitAudioContext)();
        analyserNode=micCtx.createAnalyser();
        analyserNode.fftSize=128;
        // 注：真实麦克风需要 getUserMedia，此处简化为 TTS 输出分析
      }catch(e){}
    }
  }catch(e){say('语音引擎初始化失败。','sys');voiceActive=false;setState('idle');}
}

// 口型同步：根据 TTS 播放时的振幅模拟 viseme
// 实际实现：每帧读取 analyser 数据，映射到 5 级口型（aa/ih/ou/ee/oh）
function syncMouth(){
  if(!analyserNode||!curState){requestAnimationFrame(syncMouth);return;}
  const data=new Uint8Array(analyserNode.frequencyBinCount);
  // 注：真实场景应连接麦克风流到 analyser，这里简化为随机振幅演示口型同步
  const amp=Math.random()*0.4+0.4; // 模拟振幅
  const mouth=document.querySelector('.mouth');
  const face=document.getElementById('face');
  if(!mouth||!face)return;
  const scale=Math.min(1.4,0.6+amp*2);
  mouth.style.transform=`scaleX(${scale}) scaleY(${scale*0.8})`;
  requestAnimationFrame(syncMouth);
}
requestAnimationFrame(syncMouth);

// 输入框（固定底部，仅交互模式显示）
// bottom 抬高到 122px：避免与底部 quick-states(82px) / style-switch(26px) 两排按钮重叠挡住点击
const inpWrap=document.createElement('div');inpWrap.style.cssText='position:fixed;bottom:122px;left:50%;transform:translateX(-50%);z-index:45;display:none;';
inpWrap.innerHTML=`<input id="chatInput" type="text" placeholder="对小助手说话…" style="width:460px;padding:12px 18px;border-radius:26px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font:inherit;"><button id="sendBtn" style="margin-left:8px;padding:12px 20px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font:inherit;">发送</button>`;
document.body.appendChild(inpWrap);
document.getElementById('sendBtn').onclick=chat;
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')chat();});
function openChat(){inpWrap.style.display='flex';document.getElementById('chatInput').focus();}
window.openChat=openChat;

// 双击卡片唤起对话
document.getElementById('card').addEventListener('dblclick',openChat);

// 欢迎
say('你好，我是你的桌面助手。双击我开始对话，双击头像休眠，底部可切换状态与风格。','bot');

// 开机动画
(function boot(){
  const bar=document.getElementById('bootBar');
  const msg=document.getElementById('bootMsg');
  const steps=['加载内核…','连接 Hermes Agent…','初始化监控…','同步代办…','就绪。'];
  let i=0, done=false;
  // 兜底：如果定时器被长任务饿死，4s 后强制解锁，保证 UI 不会永久卡在开机页
  const unlock=function(){ if(done) return; done=true; document.getElementById('boot').classList.add('hidden'); inpWrap.style.display='flex'; };
  setTimeout(unlock,4000);
  const t=setInterval(()=>{
    bar.style.width=((i+1)/steps.length*100)+'%';
    msg.textContent=steps[i];
    i++;
    if(i>=steps.length){
      clearInterval(t);
      setTimeout(()=>{
        unlock();
        document.getElementById('chatInput').focus();
      },600);
    }
  },320);
})();

// 双击头像切换休眠/唤醒
document.getElementById('avatarWrap').addEventListener('dblclick',e=>{
  e.stopPropagation();
  if(curState==='sleeping'){setState('idle');say('我醒了。','bot');}
  else{setState('sleeping');say('进入休眠，双击唤醒我。','bot');}
});

// 闲置 60s 自动休眠；有操作即唤醒
let lastAct=Date.now();
['click','keydown','mousemove'].forEach(ev=>document.addEventListener(ev,()=>{
  lastAct=Date.now();
  if(curState==='sleeping')setState('idle');
}));
setInterval(()=>{
  if(Date.now()-lastAct>60000&&curState==='idle')setState('sleeping');
},10000);

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
</script>

<script>
// ══════ three.js 3D 立绘接入（WebGL 不可用自动回落 2D）══════
(function(){
  var wrap=document.getElementById('avatarWrap');
  var cv2d=document.getElementById('charCanvas');
  var btn=document.getElementById('btn3d');
  var tip=document.getElementById('renderTip');

  function apply(){
    var on = MODE3D && window.PET3D && PET3D.ready;
    cv2d.style.display = on ? 'none' : 'block';
    if(window.PET3D) PET3D.setVisible(on);
    if(btn){
      btn.classList.toggle('active', on);
      btn.textContent = on ? '3D 立绘 ✓' : '切换到 3D';
      btn.style.opacity = (window.PET3D && PET3D.ready) ? '1' : '.45';
    }
    if(tip){
      tip.textContent = on
        ? ('渲染后端：three.js WebGL · ' + (PET3D.hasVRM ? 'VRM 模型' : '程序化角色'))
        : ('渲染后端：canvas 2D' + (window.PET3D && PET3D.note ? ' · ' + PET3D.note : ''));
    }
  }
  function ensure(){
    if(window.PET3D && PET3D.ready) return true;
    if(!window.PET3D || !window.THREE) return false;
    try{ return PET3D.init(wrap); }catch(e){ console.warn('3D init:', e); return false; }
  }
  window.toggle3D=function(){
    if(!MODE3D && !ensure()){
      notice('无法启用 3D', window.PET3D ? (PET3D.note || '初始化失败') : '未加载 lib/three.min.js', 'warn');
      return;
    }
    MODE3D=!MODE3D;
    if(MODE3D) PET3D.setPalette(PAL);
    apply();
    notice(MODE3D ? '已切换 3D 立绘' : '已切换 2D 渲染', MODE3D ? 'three.js 卡通渲染' : 'canvas 2D 渲染', 'ok');
  };
  window.resetAvatar=function(){ if(window.PET3D && PET3D.hasVRM) PET3D.unloadVRM(); };
  // 上下文丢失（休眠 / 驱动重置）时自动回落
  window.onRendererLost=function(){
    MODE3D=false; apply();
    notice('3D 渲染中断', 'WebGL 上下文丢失，已回落到 2D，点“切换到 3D”可重试', 'warn');
  };

  // 等一帧、布局稳定后再初始化（卡片有入场动画）
  requestAnimationFrame(function(){
    if(ensure()){ MODE3D=true; PET3D.setPalette(PAL); }
    else { MODE3D=false; notice('3D 未启用', (window.PET3D && PET3D.note) || '未加载 lib/ 下的 three.min.js', 'warn'); }
    apply();
  });

  // 拖入 .vrm / .glb 直接替换角色（无需起服务器）
  wrap.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='copy';});
  wrap.addEventListener('drop',function(e){
    e.preventDefault();
    var f=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f) return;
    if(!/\.(vrm|glb)$/i.test(f.name)){ notice('不支持的文件','只接受 .vrm / .glb 模型','warn'); return; }
    if(!ensure()){ notice('无法载入模型','WebGL 或 three-vrm 不可用','warn'); return; }
    notice('正在载入模型', f.name, 'ok');
    var fr=new FileReader();
    fr.onload=function(){
      MODE3D=true; apply(); PET3D.setPalette(PAL);
      PET3D.loadVRM(fr.result).then(function(){
        apply(); notice('模型已接管角色', f.name + ' · 拖入新模型可替换', 'ok');
      }).catch(function(err){
        notice('模型载入失败', String((err && err.message) || err), 'danger');
      });
    };
    fr.onerror=function(){ notice('读取失败','无法读取该文件','danger'); };
    fr.readAsArrayBuffer(f);
  });

  window.addEventListener('resize',function(){ if(window.PET3D && PET3D.ready) PET3D.resize(); });
})();
</script>
